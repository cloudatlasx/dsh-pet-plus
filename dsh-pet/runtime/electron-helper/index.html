<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' http: https: data: blob:; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' http: https: data:; media-src 'self' http: https: blob:; font-src 'self' http: https: data:"
    />
    <title>dsh-pet 桌宠（桌面模式）</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font-family: 'Microsoft YaHei UI', 'Segoe UI', sans-serif;
        user-select: none;
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
      /* 宠物 sprite：绝对定位在画布内，由 renderer 按角落/边距或拖拽位置计算 left/top */
      .pet-sprite {
        position: absolute;
        left: 0;
        top: 0;
        pointer-events: none;
      }
      .pet-stage {
        position: relative;
        width: var(--pet-size, 462px);
        height: calc(var(--pet-size, 462px) * 9 / 16);
        pointer-events: none;
      }
      /* 行进动画：位置指令走直线时宠物在「游」而不是被平移，配上 motion.js 的 ease-in-out，
         起步/收尾都不生硬。只挂在整个 sprite 上（.pet-stage 上有内联 translateY，动它会顶掉）。 */
      @media (prefers-reduced-motion: no-preference) {
        .pet-sprite.is-gliding {
          animation: pet-glide 760ms ease-in-out infinite alternate;
        }
        @keyframes pet-glide {
          from {
            transform: translateY(0) rotate(-0.6deg);
          }
          to {
            transform: translateY(calc(var(--pet-size, 462px) * -0.012)) rotate(0.6deg);
          }
        }
      }
      /* 变身小鱼：位置指令走直线（motion.js 的 startGlide）时，视频淡出、小鱼淡入并摆尾游过去。
         整个 .pet-fish 由 init.js 建在 stage 里；`--swim-dir` 由 motion.js 按去程左右方向写
         （右 = 1，左 = -1），所以鱼头永远朝着游的方向。停下时 is-swimming 一摘，视频就回来了。 */
      .pet-fish {
        position: absolute;
        inset: 0;
        opacity: 0;
        pointer-events: none;
        transform: scale(0.55) scaleX(var(--swim-dir, 1));
        transition:
          opacity 150ms ease,
          transform 260ms cubic-bezier(0.2, 1.35, 0.4, 1);
      }
      .pet-sprite.is-swimming .pet-fish {
        opacity: 1;
        transform: scale(1) scaleX(var(--swim-dir, 1));
        animation: pet-fish-bob 620ms ease-in-out infinite alternate;
      }
      /* 视频必须让位：鱼的淡入和视频的淡出叠在一起会有一帧「半只鸭半条鱼」 */
      .pet-sprite.is-swimming video.pet-video {
        opacity: 0 !important;
      }
      .pet-fish__body {
        position: absolute;
        left: 34%;
        top: 38%;
        width: 38%;
        height: 33%;
        border-radius: 54% 46% 44% 56% / 58% 56% 44% 42%;
        background: linear-gradient(155deg, #ffd469 0%, #ffb937 58%, #f79a2b 100%);
        box-shadow:
          inset -0.6% -0.8% 0 rgba(0, 0, 0, 0.05),
          0 2% 4% rgba(244, 162, 49, 0.35);
      }
      .pet-fish__tail {
        position: absolute;
        left: 15%;
        top: 43%;
        width: 22%;
        height: 25%;
        background: linear-gradient(200deg, #ffb937, #f0861c);
        clip-path: polygon(100% 50%, 0 0, 18% 50%, 0 100%);
        transform-origin: 100% 50%;
        animation: pet-fish-tail 420ms ease-in-out infinite alternate;
      }
      .pet-fish__fin {
        position: absolute;
        left: 50%;
        top: 63%;
        width: 16%;
        height: 15%;
        background: #ffc94d;
        clip-path: polygon(0 0, 100% 35%, 28% 100%);
      }
      .pet-fish__eye {
        position: absolute;
        right: 21%;
        top: 33%;
        width: 11%;
        height: 11%;
        border-radius: 50%;
        background: #1b1b1f;
      }
      .pet-fish__eye::after {
        content: '';
        position: absolute;
        left: 16%;
        top: 14%;
        width: 38%;
        height: 38%;
        border-radius: 50%;
        background: #fff;
      }
      .pet-fish__bubble {
        position: absolute;
        left: 9%;
        top: 24%;
        width: 5%;
        height: 5%;
        border-radius: 50%;
        border: 1.5px solid rgba(125, 205, 255, 0.8);
        opacity: 0;
        animation: pet-fish-bubble 1.5s ease-in infinite;
      }
      .pet-fish__bubble--2 {
        left: 17%;
        top: 18%;
        width: 3.6%;
        height: 3.6%;
        animation-delay: 0.5s;
      }
      @keyframes pet-fish-bob {
        from {
          transform: translateY(0) rotate(-1.6deg) scaleX(var(--swim-dir, 1));
        }
        to {
          transform: translateY(-1.4%) rotate(1.6deg) scaleX(var(--swim-dir, 1));
        }
      }
      @keyframes pet-fish-tail {
        from {
          transform: skewY(-9deg) scaleX(1);
        }
        to {
          transform: skewY(9deg) scaleX(0.92);
        }
      }
      @keyframes pet-fish-bubble {
        0% {
          opacity: 0;
          transform: translateY(0) scale(0.6);
        }
        30% {
          opacity: 0.9;
        }
        100% {
          opacity: 0;
          transform: translateY(-120%) scale(1.15);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .pet-sprite.is-swimming .pet-fish,
        .pet-fish__tail,
        .pet-fish__bubble {
          animation: none;
        }
      }
      video.pet-video {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.18s ease;
      }
      video.pet-video.is-front {
        opacity: 1;
      }
      .pet-hit {
        position: absolute;
        pointer-events: auto;
        cursor: grab;
        z-index: 1;
      }
      .pet-hit.dragging {
        cursor: grabbing;
      }
      /* 余额气泡：与浏览器 overlay 同一套视觉（白色圆润泡 + 峰/谷/错误着色）。
         尺寸分两类锚点：盒子（宽度/内边距/圆角/尾巴/阴影/行间距）锚在字号 --f 上——字号调大盒子同步变大，
         文字不会顶出白底；位置（bottom 偏移）仍锚在宠物宽度 var(--pet-size)，气泡始终贴着宠物头顶。
         宽度必须写 width:max-content：气泡是 left:50% 的绝对定位盒，可用宽度只有包含块一半，
         shrink-to-fit 会先被这道墙卡死（max-width 调多大都不生效）；写 max-content 后按内容取宽，
         再由 max-width 收口，上限同时不超过宠物宽度（桌面窗口只比宠物大一圈，超了会被裁）。
         字体经 renderer 注入上首软糖体 @font-face */
      .pet-bubble {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        bottom: calc(100% - var(--pet-size, 462px) * 0.108);
        width: max-content;
        /* 钉死 content-box：本文件全局设了 border-box，那会让 min/max-width 把内边距也算进去，
           内容可用宽度被悄悄缩掉一圈（表现为「明明还有空位却折行」）。与浏览器 bubble.ts 同一口径 */
        box-sizing: content-box;
        /* 宽度下限只到「放得下尾巴 + 一点内边距」（与 bubble.ts 同一口径）：早先给到 5.7143em，
           短句会被撑成一条长条，看起来空一半。宽度交给 width:max-content，长文本才由 max-width 收口 */
        min-width: calc(var(--f) * 2);
        max-width: min(calc(var(--f) * 19), 100%);
        padding: calc(var(--f) * 0.75) calc(var(--f) * 0.8);
        border-radius: calc(var(--f) * 0.7692);
        /* 不透明实色 + 1px 描边：气泡属于内容层，毛玻璃在这层只会糊住自己的字（与浏览器端同一口径） */
        background: rgba(255, 255, 255, 0.97);
        border: 1px solid rgba(0, 0, 0, 0.08);
        color: #18181b;
        /* 字体族走全局配置变量（renderer.js 注入到 documentElement）：对话窗/得分弹窗挂在 body 下、
           继承不到宠物根容器，气泡也统一从这里取；回退参数是变量未注入时的默认字体栈 */
        font-family: var(
          --dsh-pet-font-family,
          'ShangshouSoftCandy',
          'Yuanti SC',
          'YouYuan',
          '幼圆',
          'Comic Sans MS',
          'PingFang SC',
          'Microsoft YaHei',
          sans-serif
        );
        /* 字号：正文取 --dsh-pet-font-bubble（sprite.js 按本宠物尺寸算好注入）；--f0 是收起态的字号，
           --f 是当前生效值（展开态在 .is-expanded 里按 --f0 折算 60%），气泡内其余层级都从 --f 派生 */
        --f0: var(--dsh-pet-font-bubble, calc(var(--pet-size, 462px) * 0.0455));
        --f: var(--f0);
        font-size: var(--f);
        line-height: 1.6;
        z-index: 3;
        pointer-events: none;
        box-shadow:
          0 1px 2px rgba(0, 0, 0, 0.06),
          0 10px 24px -8px rgba(0, 0, 0, 0.24);
        opacity: 0;
        transition: opacity 0.14s ease;
        /* 不锁 nowrap：折行只在内容真超过宽度上限时才发生；break-word 只在整词放不下时断，
           不会把 85% / ¥12.34 这类数字拆到两行 */
        white-space: normal;
        overflow-wrap: break-word;
      }
      .pet-bubble::after {
        content: '';
        position: absolute;
        left: 50%;
        bottom: calc(var(--f) * -0.3736);
        transform: translateX(-50%);
        border: calc(var(--f) * 0.3736) solid transparent;
        border-top-color: rgba(255, 255, 255, 0.97);
        border-bottom: none;
      }
      .pet-bubble.is-on {
        opacity: 1;
        /* 入场 180ms：位移 8px + 缩到 0.96，缓动用 M3 的 emphasized decelerate */
        animation: pet-bub-in 0.18s cubic-bezier(0.05, 0.7, 0.1, 1) both;
      }
      @keyframes pet-bub-in {
        from {
          opacity: 0;
          transform: translate(-50%, calc(var(--f) * 0.5)) scale(0.96);
        }
        to {
          opacity: 1;
          transform: translateX(-50%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .pet-bubble.is-on {
          animation: none;
        }
      }
      /* 碎碎念变体：与浏览器 overlay 一致 —— 字号缩到余额气泡的 0.75、宽度下限只留住尾巴（1.6em），
         上限与余额气泡相同；宽度取宽/折行规则继承 .pet-bubble，高度随行数自然增长 */
      .pet-bubble.is-whisper {
        font-size: calc(var(--f) * 0.7473);
        min-width: calc(var(--f) * 1.6);
        max-width: min(calc(var(--f) * 10.989), 100%);
      }
      .pet-bub-row {
        display: flex;
        justify-content: space-between;
        gap: calc(var(--f) * 0.6593);
        flex-wrap: wrap;
      }
      /* 档位行由多个片段拼成：只允许在片段之间换行，片段内部不拆字 */
      .pet-bub-row > span {
        white-space: nowrap;
      }
      .pet-bub-sub {
        font-size: calc(var(--f) * 0.7692);
        color: rgba(43, 43, 43, 0.6);
      }
      /* 工作气泡第二行：第 N 步 · 已用 X 分钟。小一号、灰一点，不跟正文抢注意力 */
      .pet-bub-whisper-meta {
        display: block;
        margin-top: calc(var(--f) * 0.14);
        font-size: calc(var(--f) * 0.58);
        line-height: 1.3;
        color: rgba(43, 43, 43, 0.55);
        font-variant-numeric: tabular-nums;
      }
      /* 清单进度条：细条 + 右侧「4/7 项」。条子只表示队列走了多少，不表示这轮快完了 */
      .pet-bub-whisper-progress {
        display: flex;
        align-items: center;
        gap: calc(var(--f) * 0.4);
        margin-top: calc(var(--f) * 0.3);
      }
      .pet-bub-whisper-track {
        flex: 1 1 auto;
        height: calc(var(--f) * 0.3);
        border-radius: calc(var(--f) * 0.15);
        background: rgba(43, 43, 43, 0.12);
        overflow: hidden;
      }
      .pet-bub-whisper-fill {
        display: block;
        height: 100%;
        border-radius: inherit;
        background: #2e9e4f;
        transition: width 0.3s cubic-bezier(0.05, 0.7, 0.1, 1);
      }
      .pet-bub-whisper-pct {
        flex: none;
        font-size: calc(var(--f) * 0.56);
        line-height: 1;
        color: rgba(43, 43, 43, 0.5);
        font-variant-numeric: tabular-nums;
      }
      .pet-bub-err {
        color: #d94f3d;
        font-size: calc(var(--f) * 0.7692);
      }
      .pet-bub-tier {
        font-weight: 700;
      }
      .pet-bub-tier-peak {
        color: #e53935;
      }
      .pet-bub-tier-idle {
        color: #2e9e4f;
      }
      /* ---- 展开态（点余额气泡后的完整额度）：每窗口一行，进度条长度 = 已用百分比 ----
         与浏览器端 src/client/bubble.ts 的规则逐条对应（两端样式各存一份，数值必须同步） */
      /* 可点：气泡默认 pointer-events:none（不挡下层应用），只有这张可展开的余额气泡才开命中。
         光有 DOM 可点还不够——窗口级穿透由 main 的 setIgnoreMouseEvents 管，气泡矩形要经
         syncInputRegions 上报给主进程，见 sprite.js */
      .pet-bubble.is-clickable {
        pointer-events: auto;
        cursor: pointer;
      }
      /* 收起态宽度上限 10.989em 排不下四列，展开态单独给一档更宽的：21em（60% 字号下 ≈265px）。
         整体缩到收起字号的 60%：--f 是盒内所有尺寸的锚点（字号/内边距/圆角/进度条高度全跟着它缩） */
      .pet-bubble.is-expanded {
        --f: calc(var(--f0) * 0.6);
        width: min(calc(var(--f) * 21), 100%);
        max-width: 100%;
      }
      /* 淡出：换内容前先降到透明（.25s，复用 opacity 那条过渡曲线），换完去掉这个类再淡入 */
      .pet-bubble.is-on.is-fading {
        opacity: 0;
      }
      .pet-bub-quota {
        display: flex;
        align-items: center;
        gap: calc(var(--f) * 0.4);
        margin: calc(var(--f) * 0.13) 0;
      }
      .pet-bub-quota-label {
        flex: none;
        min-width: calc(var(--f) * 1.9);
        font-size: calc(var(--f) * 0.7692);
        color: rgba(43, 43, 43, 0.6);
      }
      .pet-bub-quota-bar {
        flex: 1 1 auto;
        height: calc(var(--f) * 0.5);
        border-radius: calc(var(--f) * 0.25);
        background: rgba(43, 43, 43, 0.12);
        overflow: hidden;
      }
      .pet-bub-quota-fill {
        display: block;
        height: 100%;
        border-radius: inherit;
        background: #2e9e4f;
      }
      .pet-bub-quota-fill.pet-bub-quota-warn {
        background: #e8952f;
      }
      .pet-bub-quota-fill.pet-bub-quota-crit {
        background: #e53935;
      }
      .pet-bub-quota-used {
        flex: none;
        min-width: calc(var(--f) * 2.2);
        text-align: right;
        font-variant-numeric: tabular-nums;
        font-weight: 650;
        color: #1f1f1f;
      }
      .pet-bub-quota-reset {
        flex: none;
        min-width: calc(var(--f) * 2.6);
        text-align: right;
        font-size: calc(var(--f) * 0.7692);
        color: rgba(43, 43, 43, 0.6);
      }
      /* 用量页（第三页）：三行两列占满展开态宽度，总量是唯一的大字。
         配色只给进/出两处强调，其余沿用次级灰——同页里超过两种彩色会盖过数值本身。
         与浏览器端 src/client/bubble.ts 的规则逐条对应，数值必须同步 */
      .pet-bub-usage {
        display: flex;
        flex-direction: column;
        gap: calc(var(--f) * 0.22);
        margin: calc(var(--f) * 0.1) 0;
      }
      .pet-bub-usage-line {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: calc(var(--f) * 0.8);
        line-height: 1.45;
      }
      .pet-bub-usage-title {
        font-size: calc(var(--f) * 0.7692);
        color: rgba(43, 43, 43, 0.62);
      }
      .pet-bub-usage-total {
        font-size: calc(var(--f) * 1.45);
        line-height: 1.2;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.02em;
        color: #1f1f1f;
      }
      .pet-bub-usage-in {
        font-size: calc(var(--f) * 0.7692);
        font-variant-numeric: tabular-nums;
        color: #3f6ea8;
      }
      .pet-bub-usage-out {
        font-size: calc(var(--f) * 0.7692);
        font-variant-numeric: tabular-nums;
        color: #b4703c;
      }
      .pet-bub-usage-period {
        font-size: calc(var(--f) * 0.7692);
        color: rgba(43, 43, 43, 0.62);
      }
      .pet-bub-usage-spend {
        font-size: calc(var(--f) * 0.7692);
        font-weight: 650;
        font-variant-numeric: tabular-nums;
        color: #1f1f1f;
      }
      /* 进出比例条：两段按真实占比分宽，颜色与下面的数字一一对应；占比极小时只留一条细线，不放大 */
      .pet-bub-usage-bar {
        display: flex;
        height: calc(var(--f) * 0.3);
        border-radius: calc(var(--f) * 0.15);
        overflow: hidden;
        background: rgba(43, 43, 43, 0.1);
        margin: calc(var(--f) * 0.05) 0;
      }
      .pet-bub-usage-bar-in {
        display: block;
        height: 100%;
        background: #3f6ea8;
      }
      .pet-bub-usage-bar-out {
        display: block;
        height: 100%;
        background: #b4703c;
      }
      /* ---- 请求气泡（审批 / 提问）与定时提醒：与网页端 request-bubble.ts 同一套视觉 ----
         请求气泡必须可点：窗口级穿透由主进程按控件矩形翻转，类名 is-clickable 是渲染端登记矩形的唯一入口 */
      /* 请求气泡按内容取宽：早先这里钉死 width:20em（380px 宠物约 346px），一句话的提醒也被撑成满条，
         正是「文字没那么长、泡泡挺长」的来源。宽度回到 max-content，只保留 20em 的上限，
         长正文/按钮行仍会被收口折行 */
      .pet-bubble.is-request {
        width: max-content;
        max-width: min(calc(var(--f) * 20), 100%);
        pointer-events: auto;
      }
      /* 新请求到达时弹两下：用户如果当时在别的窗口，靠这一下把眼睛拽回来（声音由 playAttentionSound 负责） */
      .pet-bubble.is-attn {
        animation: pet-bub-attn 560ms cubic-bezier(0.2, 0.8, 0.2, 1) 2;
      }
      @keyframes pet-bub-attn {
        0%,
        100% {
          transform: translateX(-50%) scale(1);
        }
        45% {
          transform: translateX(-50%) scale(1.06);
        }
      }
      .pet-bub-req {
        display: flex;
        flex-direction: column;
        gap: calc(var(--f) * 0.32);
        max-height: calc(var(--f) * 9.2);
        overflow-y: auto;
        overscroll-behavior: contain;
      }
      /* 「发送」必须一直看得见：请求气泡拆成「头部 / 可滚的题目区 / 固定按钮行」三段。
         早先整颗 .pet-bub-req 是滚动容器，选完一个选项要整体重画 innerHTML，
         scrollTop 归零 → 底部按钮跑到视野外，用户得再往下拉一次（网页端同口径）。 */
      .pet-bub-req.is-split {
        overflow: hidden;
        justify-content: flex-start;
      }
      .pet-bub-req__scroll {
        display: flex;
        flex-direction: column;
        gap: calc(var(--f) * 0.32);
        min-height: 0;
        overflow-y: auto;
        overscroll-behavior: contain;
      }
      .pet-bub-req.is-split > .pet-bub-req__actions {
        flex: none;
      }
      .pet-bub-req__head {
        display: flex;
        align-items: center;
        gap: calc(var(--f) * 0.35);
      }
      .pet-bub-req__badge {
        flex: none;
        font-size: calc(var(--f) * 0.72);
        font-weight: 700;
        color: #fff;
        background: #4a6cf7;
        border-radius: 999px;
        padding: 0 calc(var(--f) * 0.4);
        line-height: 1.5;
      }
      .pet-bub-req__badge.is-question {
        background: #e8952f;
      }
      .pet-bub-req__title {
        font-weight: 700;
        font-size: calc(var(--f) * 0.95);
        overflow-wrap: anywhere;
      }
      .pet-bub-req__text {
        font-size: calc(var(--f) * 0.86);
        line-height: 1.5;
        opacity: 0.85;
        overflow-wrap: break-word;
      }
      .pet-bub-req__q {
        display: flex;
        flex-direction: column;
        gap: calc(var(--f) * 0.18);
      }
      .pet-bub-req__qhead {
        font-size: calc(var(--f) * 0.8);
        font-weight: 700;
        opacity: 0.7;
      }
      .pet-bub-req__actions {
        display: flex;
        flex-wrap: wrap;
        gap: calc(var(--f) * 0.28);
        margin-top: calc(var(--f) * 0.12);
      }
      .pet-bub-btn {
        appearance: none;
        border: 1px solid rgba(43, 43, 43, 0.18);
        background: rgba(255, 255, 255, 0.9);
        color: #2b2b2b;
        border-radius: calc(var(--f) * 0.45);
        padding: calc(var(--f) * 0.16) calc(var(--f) * 0.55);
        font: inherit;
        font-size: calc(var(--f) * 0.82);
        line-height: 1.5;
        cursor: pointer;
      }
      .pet-bub-btn:hover {
        background: #fff;
        border-color: rgba(43, 43, 43, 0.32);
      }
      .pet-bub-btn.is-primary {
        background: #4a6cf7;
        border-color: #4a6cf7;
        color: #fff;
      }
      .pet-bub-btn.is-primary:hover {
        background: #3d5ce0;
      }
      .pet-bub-btn.is-ghost {
        border-color: transparent;
        background: transparent;
        opacity: 0.7;
      }
      .pet-bub-btn[disabled] {
        opacity: 0.4;
        cursor: default;
      }
      .pet-bub-opt {
        text-align: left;
      }
      .pet-bub-opt.is-picked {
        border-color: #4a6cf7;
        background: rgba(74, 108, 247, 0.12);
      }
      .pet-bub-req__input {
        appearance: none;
        width: 100%;
        box-sizing: border-box;
        border: 1px solid rgba(43, 43, 43, 0.18);
        background: rgba(255, 255, 255, 0.92);
        color: #2b2b2b;
        border-radius: calc(var(--f) * 0.45);
        padding: calc(var(--f) * 0.18) calc(var(--f) * 0.5);
        font: inherit;
        font-size: calc(var(--f) * 0.82);
        line-height: 1.5;
        outline: none;
      }
      .pet-bub-req__input:focus {
        border-color: #4a6cf7;
        box-shadow: 0 0 0 2px rgba(74, 108, 247, 0.18);
      }
      .pet-bub-req__err {
        font-size: calc(var(--f) * 0.78);
        line-height: 1.5;
        color: #c0392b;
      }
      .pet-bub-rem__title {
        font-weight: 700;
        font-size: calc(var(--f) * 0.95);
      }
      .pet-bub-rem__text {
        font-size: calc(var(--f) * 0.85);
        opacity: 0.82;
        overflow-wrap: break-word;
        white-space: pre-wrap;
      }
      /* 分条明细：一条一行，整体限高滚动，长清单（今天要做的事）也能读完 */
      .pet-bub-rem__lines {
        display: flex;
        flex-direction: column;
        gap: calc(var(--f) * 0.14);
        max-height: calc(var(--f) * 4.6);
        overflow-y: auto;
        overscroll-behavior: contain;
      }
      .pet-bub-rem__line {
        font-size: calc(var(--f) * 0.82);
        line-height: 1.45;
        overflow-wrap: break-word;
        padding-left: calc(var(--f) * 0.72);
        text-indent: calc(var(--f) * -0.72);
      }
      .pet-bub-rem__line::before {
        content: '·';
        margin-right: calc(var(--f) * 0.3);
        font-weight: 700;
        color: #4a6cf7;
      }
      .pet-bub-rem__hint {
        font-size: calc(var(--f) * 0.76);
        line-height: 1.4;
        opacity: 0.6;
        overflow-wrap: break-word;
      }
      /* 快捷动作芯片：一排「能做的事」，点了就把话投回会话 */
      .pet-bub-rem__quick {
        display: flex;
        flex-wrap: wrap;
        gap: calc(var(--f) * 0.26);
      }
      .pet-bub-rem__chip {
        appearance: none;
        font-family: inherit;
        font-size: calc(var(--f) * 0.78);
        line-height: 1.2;
        padding: calc(var(--f) * 0.24) calc(var(--f) * 0.56);
        border-radius: calc(var(--f) * 0.95);
        border: 1px solid rgba(63, 110, 168, 0.45);
        background: rgba(63, 110, 168, 0.09);
        color: #2f5687;
        font-weight: 600;
        cursor: pointer;
        pointer-events: auto;
      }
      .pet-bub-rem__chip:hover {
        background: rgba(63, 110, 168, 0.18);
        border-color: rgba(63, 110, 168, 0.66);
      }
      .pet-bub-req__badge.is-announce {
        background: #2e9e4f;
      }
      /* 对话里约好的提醒：与调度器的蓝、会话推送的绿分开 */
      .pet-bub-req__badge.is-chat {
        background: #7c5cd6;
      }
      /* 待办清单到点：橙色，一眼认出是清单里的事 */
      .pet-bub-req__badge.is-todo {
        background: #c9762a;
      }
      .pet-bub-rem__time {
        font-size: calc(var(--f) * 0.72);
        opacity: 0.55;
      }
      /* 配置错误提示（大声报错，不做静默兜底）：配置缺失/非法时显示，每 5s 自动重试 */
      .pet-error {
        position: fixed;
        left: 50%;
        top: 24px;
        transform: translateX(-50%);
        max-width: 80vw;
        background: rgba(217, 79, 61, 0.95);
        color: #fff;
        border-radius: 12px;
        padding: 10px 16px;
        font-size: 13px;
        line-height: 1.5;
        display: none;
        z-index: 999;
        pointer-events: none;
        word-break: break-all;
      }
      .pet-error.visible {
        display: block;
      }
      @media (prefers-reduced-motion: reduce) {
        video.pet-video {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="pet-error" class="pet-error"></div>
    <!-- 共享纯逻辑（src/shared 的 iife 构建产物，window.PetShared）——经经典 script，避开 file:// ESM 的 CORS 限制。
         桌面端同模式拆分：shared-core（纯逻辑）→ constants（基础设施）→ sprite（宠物本体与几何）→ sprite-*（原型扩展，
         须排在 sprite.js 之后）→ events（事件联动）→ renderer（启动入口） -->
    <script src="./shared-core.js"></script>
    <script src="./constants.js"></script>
    <script src="./sprite.js"></script>
    <script src="./sprite/init.js"></script>
    <script src="./sprite/playback.js"></script>
    <script src="./sprite/motion.js"></script>
    <script src="./sprite/input.js"></script>
    <script src="./sprite/bubble.js"></script>
    <script src="./sprite/menu.js"></script>
    <script src="./events.js"></script>
    <script src="./renderer.js"></script>
  </body>
</html>
